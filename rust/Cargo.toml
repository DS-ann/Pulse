[package]
name = "rust_lib_pulse"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
rodio = { version = "0.20.1", default-features = false, features = ["symphonia-all"] }
byteorder = "1.5.0"
crc32fast = "1.4.2"
base64 = "0.22.1"
chfft = "0.3.4"

tempfile = '3.16.0'

tokio = '1.43.0'
serde_json = '1.0.138'
blocking = '1.5.1'
futures = '0.3.31'
serde = { version = '1.0.217', features = ['derive'] }
bytes = '1.10.0'

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
